version: "3.8"
services:
  mysql:
    image: mysql
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - "/mysql/conf:/etc/mysql/conf.d"
      - "/mysql/data:/var/lib/mysql"
      - "/mysql/init:/docker-entrypoint-initdb.d"
    networks:
      - ecosphere-net
  ecosphere-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecosphere-server
    ports:
      - "8080:8080"
    environment:
      AI_DASHSCOPE_API_KEY: ${AI_DASHSCOPE_API_KEY}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
    networks:
      - ecosphere-net
    depends_on:
      - mysql
  nginx:
    image: nginx
    container_name: nginx
    ports:
      - "18080:18080"
      - "18081:18081"
    volumes:
      - "/root/webDocker/nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "/root/webDocker/nginx/html:/usr/share/nginx/html"
    depends_on:
      - ecosphere-server
    networks:
      - ecosphere-net
  redis:
    image: redis
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - ecosphere-net
networks:
  ecosphere-net:
    name: qht